x-service-defaults: &service-defaults
  environment:
    - TZ=America/Chicago
  restart: unless-stopped
  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "3"


services:
  # The FastAPI backend service
  api:
    <<: *service-defaults
    build:
      context: ./server
      target: app
    image: lexo/server:latest
    env_file:
      - ./server/.env.prod.secret  # TODO: Probably replace this with secrets injected by CI/CD pipeline?
    volumes:
      # Mount a named volume to persist the SQLite database.
      - db-data:/code/data
    # ports:
    #   # Expose port 8000 to the host for direct API access during development.
    #   # The frontend service will access this internally via http://api:8000
    #   - "8000:8000"
    depends_on:
      redis:
        condition: service_healthy
    # The healthcheck ensures the 'api' service is actually running and healthy
    # before other services (like the frontend) that depend on it start.
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "--output", "/dev/null", "http://localhost:8000/api/config"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 10s

  scheduler:
    <<: *service-defaults
    build:
      context: ./server
      target: scheduler
    image: lexo/scheduler:latest
    env_file:
      - ./server/.env.prod.secret
    volumes:
      - db-data:/code/data


  # The Cappy service that builds and serves the React frontend
  frontend:
    <<: *service-defaults
    build: ./client
    image: lexo/frontend:latest
    ports:
      - "4747:80"
      - "443:443"
    depends_on:
      api:
        condition: service_healthy

  # The Redis service for caching API responses
  redis:
    <<: *service-defaults
    image: redis:8.2-alpine
    command: redis-server --maxmemory 50mb --maxmemory-policy allkeys-lru
    healthcheck:
      # This command checks if the Redis server is ready to accept commands.
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

# Define the named volume for database persistence
volumes:
  db-data:
    driver: local
