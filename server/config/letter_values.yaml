# Map from effective date of letter values to full letter -> point mapping.
# The effective date is in YYYY-MM-DD format.  The most recent date <= today's date is used.
#
# The letter scores based on Peter Norvig's letter-frequency calculations, scaled down.
# http://norvig.com/scrabble-letter-scores.html
#
# There was also an issue in the distant past where `N` was a YAML shortcut for "false".  That
# doesn't seem to be the case anymore (the rules currently load without issue), but if it does
# cause problems, try changing the key for `N` in `letter_values` to `"N"` (that is, with quotes)
# to force it to be a string.--JDB 2025-10-10

